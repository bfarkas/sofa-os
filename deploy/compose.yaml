# Sofa.OS Server on rei3. From the repository root:
#   git pull && docker compose -f deploy/compose.yaml up -d --build
# Set the Companion password first with deploy/set-password.sh.
services:
  sofa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sofa-os-server:latest
    container_name: sofa-os
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090" # Caddy only; the route allows LAN and VPN clients (ADR 0002)
    environment:
      TZ: Europe/Berlin
      SOFA_PASSWORD_HASH_FILE: /run/secrets/companion_password_hash
      SOFA_HA_URL: http://192.168.42.24:8123
      SOFA_HA_TOKEN_FILE: /run/secrets/ha_token # long-lived token; the write guard limits what it may do
      SOFA_HA_DRY_RUN: ${SOFA_HA_DRY_RUN:-0} # 1: log Home Assistant writes instead of sending them (Watch Allowance live run)
      SOFA_IMMICH_URL: http://immich_server:2283 # over the homeserver_immich network below; Immich publishes no port on the LAN
      SOFA_IMMICH_API_KEY_FILE: /run/secrets/immich_api_key # empty file: Immich off, photo widgets say so
    volumes:
      - sofa-data:/data # SQLite database, back this up
      - sofa-media:/media # media cache (photos/ and albums/), safe to lose
    networks:
      - default
      - immich
    secrets:
      - companion_password_hash
      - ha_token
      - immich_api_key

networks:
  immich:
    name: homeserver_immich # Immich's own bridge (~/homeserver/immich/docker-compose.yml); it must be up before this service starts
    external: true

volumes:
  sofa-data:
  sofa-media:

secrets:
  # Secret files live outside the repository, owned by the deploying user (uid 1000, as the container's node user).
  companion_password_hash:
    file: ${HOME}/.config/sofa-os/secrets/companion_password_hash
  ha_token:
    file: ${HOME}/.config/sofa-os/secrets/ha_token
  # An Immich API key (Immich: Account Settings > API Keys) with exactly album.read, asset.read and asset.view. Create the
  # file before deploying, even empty (then Immich is off): compose refuses a secret whose file is missing.
  immich_api_key:
    file: ${HOME}/.config/sofa-os/secrets/immich_api_key
