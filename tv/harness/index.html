<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sofa Home widget cards</title>
<!-- Sofa Home's inline stylesheet is inserted before this link by harness.js; this page's own rules come last. -->
<link id="cards-css" rel="stylesheet" href="../app/cards.css">
<style>
  html, body { height: auto !important; overflow: auto !important; background: #56677a !important; } /* a mid-dark wallpaper stand-in: the tiles are smoked glass */
  #stage { --on-bg: #fffdf8; width: 1920px !important; height: auto !important; overflow: visible !important; padding: 30px 96px !important; }
  h2 { margin: 30px 0 8px; font-size: 30px; }
  .grid { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .cell { margin: 0 20px 20px 0; }
  .cell .tile { margin: 0; }
  .cap { margin-top: 8px; font-size: 20px; }
  .fullbox { width: 780px; height: 380px; margin: 0 28px 28px 0; overflow: hidden; }
  .fullbox .full { transform: scale(.5); transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="harness.js"></script>
</body>
</html>
