<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofa.OS Companion</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f5d46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sofa.OS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Sofa.OS</h1>
  <form id="login" hidden>
    <label for="password">Companion password</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <section id="tv" hidden>
    <p id="tv-ask">Sign in the TV that shows this code?</p>
    <p class="code" id="tv-code"></p>
    <button id="approve" type="button">Approve</button>
    <p id="tv-result" role="status"></p>
  </section>
  <section id="home" hidden>
    <p>Signed in.</p>
    <p><a class="button" href="/edit">Edit Home Screen</a></p>
    <p><a class="button" href="/kids">Kids Mode</a></p>
    <p><a class="button" href="/remote">Phone Remote</a></p>
    <button id="logout" type="button">Sign out</button>
  </section>
  <section id="edit" hidden>
    <div class="ed-top"><h2>Home Screen</h2><a href="/">Back</a></div>
    <div class="ed-cols">
      <div class="ed-side">
        <div class="preview-wrap" id="preview-wrap"><iframe id="preview" src="/preview.html" title="Preview of the TV" width="1920" height="1080" tabindex="-1"></iframe></div>
      </div>
      <div class="ed-main">
        <label class="check"><input type="checkbox" id="preview-kids">Preview Kids Mode</label>
        <nav id="ed-tabs" class="tabs"></nav>
        <div id="ed-notice"></div>
        <div id="ed-pane"></div>
      </div>
    </div>
    <div class="ed-bar" id="ed-bar"></div>
  </section>
  <section id="remote" hidden>
    <div class="ed-top"><h2>Remote</h2><a href="/">Back</a></div>
    <div id="remote-pad"></div>
    <p id="remote-note" role="status"></p>
  </section>
  <section id="kids" hidden>
    <h2>Kids Mode</h2>
    <p id="kids-status" role="status"></p>
    <h3>Top-up</h3>
    <div class="topup" id="kids-topup"></div>
    <h3>Allowance and apps</h3>
    <label for="kids-minutes">Daily minutes</label>
    <input id="kids-minutes" type="number" min="0" max="1440" inputmode="numeric">
    <fieldset id="kids-apps"><legend>Approved apps</legend></fieldset>
    <button id="kids-save" type="button">Save and publish</button>
    <h3>PIN</h3>
    <p id="kids-pin-status"></p>
    <label for="kids-pin">New PIN (four digits)</label>
    <input id="kids-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="kids-pin-set" type="button">Set PIN</button>
    <h3>Adult exit</h3>
    <button id="kids-exit" type="button">Exit Kids Mode</button>
    <p id="kids-result" role="status"></p>
    <p><a href="/">Back</a></p>
  </section>
  <section id="topup" hidden>
    <h2>Kids Mode Top-up</h2>
    <p class="code" id="topup-left"></p>
    <p id="topup-text" role="status"></p>
    <div class="topup" id="topup-controls"></div>
    <p><a href="/kids">Kids Mode page</a></p>
  </section>
</main>
<template id="topup-template">
  <div class="buttons"><button type="button" data-minutes="5">+5 min</button><button type="button" data-minutes="10">+10 min</button></div>
  <div class="custom"><input type="number" min="1" max="240" inputmode="numeric" placeholder="Minutes" aria-label="Custom minutes"><button type="button" data-custom>Add</button></div>
  <p class="result" role="status"></p>
</template>
<script src="/main.js"></script>
</body>
</html>
